# Fly.io-konfig — Hellbourne Wars multiplayer-server.
# Flyttad från Render för Stockholm-lokal, lägre ping + mindre jitter (user 2026-06-26).
# Spel-rummen ligger i minne → EN maskin, ingen auto-sleep (får aldrig somna/splittras).
app = "hellbourne-wars-online"
primary_region = "arn"   # Stockholm — närmast användaren

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
